<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<br>Math.PI: ", Math.PI)
        document.write("<br>Square Root of 16: ", Math.sqrt(16))

        //functions
        document.write("<br>5<sup>2</sup>: ", Math.pow(5,2))
        document.write("<br>Sqaure root of 64: ", Math.sqrt(64))

        let r=Math.random()
        document.write("<br>Random Number: ", r)
    
        let n = r * 100
        document.write("<br>Random Number between 0 and 100: ", n)
        //lets do rounding
        document.write("<br>Rounded Number: ", Math.round(n))
        //truncate
        document.write("<br>Truncated Number: ", Math.trunc(n))
        //floor
        document.write("<br>Floor Number: ", Math.floor(n))
        //ceil
        document.write("<br>Ceil Number: ", Math.ceil(n))

        //tofixed()
        document.write("<br>Fixed to 2 decimal places: ", n.toFixed(2))

        n=123

        //toprescision()
        document.write("<br>Precision to 2 decimal places: ", n.toPrecision(5))

        //toexponential()
        document.write("<br>Exponential: ", n.toExponential(2))

        //lets make rock paper scissors game where player chooses rock, paper or scissors and computer chooses randomly and we decide the winner in a function
        
        


    </script>
</body>
</html>
