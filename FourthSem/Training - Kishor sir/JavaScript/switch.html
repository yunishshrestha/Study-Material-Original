<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    Switch - case
    syntax:
        switch(key){
            case value1:
                statement if key === value1
                break    
            case value2:
                statement if key === value2
                break    
            case value3:
                statement if key === value3
                break    
            
            default: 
                statement if key does not match any above cases
        }
    -->
        <script>
            let num = Number(prompt("Enter a number from 1 to 7: "))
            switch(num){
                case 1:
                    document.write("Sunday")
                    break
                case 2:
                    document.write("Monday")
                    break
                case 3:
                    document.write("Tuesday")
                    break
                case 4:
                    document.write("Wednesday")
                    break
                case 5:
                    document.write("Thursday")
                    break
                case 6:
                    document.write("Friday")
                    break
                case 7:
                    document.write("Saturday")
                    break
                default:
                    document.write("Enter a valid number!!!!")
                    break
            }

        </script>
</body>
</html>
