<body>
    <!--Loops: to perform similar task repeteadly
    1. While loop
        initialization
        while(condition-check){
            statements next    
        }
              2. Do while loop:
    inintialization 
    do{
        statements next
    }while(condition-check)
            initialization - when to start
            condition-check - when to stop
            statements - what to repeat
            next - how to proceed

    3. For loop
    for(initialization; condition-check; next){
        statements
    }
            -->
    <script>
