<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
    div{
        height:200px;
    }
    .demo4{
        background-image: url(image.png);
        background-repeat: repeat-x;
        background-position: center;
        background-size: contain;
        background-clip: text;
        color: transparent;
        font-size: 150px;
        background-attachment: fixed;
        text-align: center;
    }
    .demo1{
        /* background-color: rgb(0, 0, 0); */
        /* rgb values range from 0 to 255
        if more than 256, it will be treated as 255 
        if all 0, it will be black
        if all 255, it will be white
        if one 0 and two 255, it will be red, green or blue depending on which one is 0
        */
        

        /* background-color:hsl(40, 0%, 50%); */
        /* range of hsl is:
           hue: 0-360
           saturation: 0-100%
           lightness: 0-100%
           color wheel: hue is the angle on the color wheel, saturation is the intensity of the color and lightness is the brightness of the color
        */

        /* background-color: #a00000; */
        /* if only 3 digits are used, it will be treated as 6 digits by repeating each digit twice */
        /* hex code for red, #RRGGBB where RR is red, GG is green and BB is blue in hexadecimal */
        background-image: linear-gradient( -70deg, red, blue, green, pink, purple 80%, orange, yellow, cyan 20%, magenta, black, white );
       /* hsla can be used to specify colors with alpha (transparency) */
        
       /* if any color is required, you can refer to htmlcolors.com where you can find a list of all available colors
       
        also gradients are available in htmlcolors.com and wheel charters */
    }
    .demo2{
        background-image: radial-gradient(circle at 20px 500px, green, pink, purple , orange, magenta, black, white);
    }
    .demo3{
        background-image: url(https://images.pexels.com/photos/12421204/pexels-photo-12421204.jpeg);
        /* background-size: 50% 100%; */
        background-size: contain;
        background-repeat: repeat-x;
        background-position: center;
        background-attachment: fixed;
    }
    



    </style>
</head>
<body>
    <div class="demo1"></div>
    <div class="demo2"></div>
    <div class="demo3"></div>
    <div class="demo4" >

        Yunish Shrestha
    </div>
    <div class="demo5"></div>
    <div class="demo6"></div>
    <div class="demo7"></div>
    <div class="demo8"></div>
    <div class="demo9"></div>
    <div class="demo10"></div>
    

</body>
</html>
