<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 450px;
            width: 75%;
            margin: auto;
            background-color: aqua;
            position: relative;
        }

        .slider_img{
            height: 100%;
            width: 100%;
        }
        .left_button{
            position: absolute;
            left: 0;
            top: 45%;
            color: aqua ;
            padding: 20px;
        }
        .right_button{
            position: absolute;
            right: 0;
            top: 45%;
            color: rgb(204, 90, 28);
            padding: 20px;

        }

    </style>

</head>
<body>
    <div class="container">

        <img src="https://wallpapershome.com/images/pages/pic_h/3441.jpg" alt="" class="slider_img">
        <div class="left_button">&lt;&lt;LEFT</div>
        <div class="right_button">RIGHT&gt;&gt;</div>
    </div>
</body>
</html>
