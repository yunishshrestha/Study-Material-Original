<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- Header Start -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!--Header Start  -->
    <div class="container-fluid">
        <div class="row bg-dark text-white align-items-center py-1">
            <div class="col-md-3 fs-3 fw-bold text-center">LOGO</div>
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Enter your search here"
                        aria-label="Recipient’s username" aria-describedby="button-addon2">
                    <button class="btn btn-warning" type="button" id="button-addon2">SEARCH</button>
                </div>
            </div>
            <div class="col-md-3 fs-3 d-flex justify-content-evenly">
                <a href="./login.html">
                    <i class="bi bi-box-arrow-in-left text-warning"></i>
                </a>
                <a href="./register.html">
                    <i class="bi bi-person-plus text-warning"></i>
                </a>
                <a href="./cart.html">
                    <i class="bi bi-cart text-warning"></i>
                </a>
            </div>
        </div>
    </div>
    <div class="bg-secondary">
        <div class="d-md-flex d-none w-50 mx-auto d-flex justify-content-evenly">
            <a href="./index.html" class="text-white text-decoration-none">HOME</a>
            <a href="./products.html" class="text-white text-decoration-none">PRODUCTS</a>
            <a href="./services.html" class="text-white text-decoration-none">SERVICES</a>
            <a href="./blogs.html" class="text-white text-decoration-none">BLOGS</a>
            <a href="./contact.html" class="text-white text-decoration-none">CONTACT</a>
        </div>
        <div class="w-100 d-md-none mx-auto d-flex justify-content-evenly">
            <a href="./index.html" class="text-white text-decoration-none">HOME</a>
            <a href="./products.html" class="text-white text-decoration-none">PRODUCTS</a>
            <a href="./services.html" class="text-white text-decoration-none">SERVICES</a>
            <a href="./blogs.html" class="text-white text-decoration-none">BLOGS</a>
            <a href="./contact.html" class="text-white text-decoration-none">CONTACT</a>
        </div>

    </div>

    <!--Header End -->
    <!--Main Start  -->
    <div class="container-fluid">
        <div class="row">
            <div class="col-11 col-sm-10 col-md-8 col-lg-6 p-5 shadow-lg mx-auto my-5">
                <main class="form-signin w-100 m-auto">
                    <form>
                        <img class="mb-4" src="/docs/5.2/assets/brand/bootstrap-logo.svg" alt="" width="72" height="57">
                        <h1 class="h3 mb-3 fw-normal">Sign Up Now</h1>

                        <div class="form-floating">
                            <input type="text" class="form-control" id="fname" placeholder="abc">
                            <label for="fname">First Name</label>
                        </div>

                        <div class="form-floating">
                            <input type="text" class="form-control" id="lname" placeholder="abc">
                            <label for="lname">Last Name</label>
                        </div>
                        <div class="form-floating">
                            <input type="text" class="form-control" id="dob">
                            <label for="dob">Date of Birth</label>
                        </div>

                        <div class="form-floating">
                            <select name="" id="add" class="form-control">
                                <option value="">Kathmandu</option>
                                <option value="">Lalitpur</option>
                                <option value="">Bhaktapur</option>
                            </select>
                            <label for="add">Address</label>
                        </div>



                        <div class="input-group">
                            <input type="file" class="form-control" id="photo">
                            <label class="input-group-text" for="photo">Photo</label>
                        </div>

                        <div class="form-floating">
                            <textarea name="" class="form-control" id="" placeholder=""></textarea>
                            <label for="">About Yourself</label>
                        </div>

                        <div class="form-floating">
                            <div class="form-control d-flex justify-content-evenly">
                                <div>
                                    <input type="radio" id="m" class="form-check-input" name="gender" checked>
                                    <label for="m" class="form-check-label">Male</label>
                                </div>

                                <div>
                                    <input type="radio" id="f" name="gender">
                                    <label for="f" >Female</label>
                                </div>

                                <div>
                                    <input type="radio" id="o" name="gender">
                                    <label for="o">Other</label>
                                </div>
                            </div>
                            <label for="">Gender</label>
                        </div>


                        <div class="form-floating">
                            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                            <label for="floatingInput">Email address</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                            <label for="floatingPassword">Password</label>
                        </div>

                        <div class="checkbox mb-3">
                            <label>
                                <input type="checkbox" value="remember-me"> I accept the terms and conditions.
                            </label>
                        </div>
                        <button class="w-100 btn btn-lg btn-primary" type="submit">Register</button>
                        <div class="d-md-flex justify-content-between">
                            <span>Already have an account? <a href="./login.html">Sign In</a></span>
                            <a href="./forgetpassword">Forget Password</a>
                        </div>
                        <p class="mt-5 mb-3 text-muted">&copy; 2017–2022</p>
                    </form>
                </main>
            </div>
        </div>
    </div>
    <!--Main End -->
    <!--footer Start  -->
    <div class="p-5 text-center fs-4 fw-bold bg-secondary-subtle">&copy;Copyright2026.</div>
    <!-- Footer End -->


    <!-- Bootstrap as JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
