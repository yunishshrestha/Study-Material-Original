<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        div{
        width: 200px ;
        height: 200px;
        margin: auto;
        

        }
        .demo1{
            background-color: blue;
            /* individual sides */
            margin-top: 30px;
            margin-left: 25px;
            margin-right: 20px;
            margin-bottom: 20px;

            /* margin shorthand */
            margin: 30px;
            margin: 20px 40px;
            margin: 20px 50px 10px;
            margin: 20px 50px 10px 5px;
            

        }
        .demo2{
            background-color: green;
            text-align: justify;
            padding: 20px;
            padding: 20px 40px;
            padding: 20px 40px 15px;
            padding: 20px 40px 15px 30px;
        }
        .demo3{
            color: blue;
            background-color: yellow;
            border-color: red;
            border-width: 10px;
            border-style: solid;
            /* solid, dotted, dashed, double, inset, outset, ridge, groove */
            border-buttom-color: purple;
            border-left-style: dotted;
            border-right-width: 50px;
            /* shorthand */
            border: 10px solid grey;
            border-left: red double 15px;
            border-right: dashed 20px purple;
            /* outline: blue double 15px; not important*/
            border-radius: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 50px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 50px ;

            border-radius: 15px 30px 50px 60px ;
            border-radius: 50% ;
            margin: 100px auto;
            box-shadow: inset -20px -20px 10px 20px rgb(171, 239, 68), 20px 20px 10px 20px rgb(176, 85, 16), -20px 20px 10px 20px rgb(16, 176, 85), 20px -20px 10px 20px rgb(85, 16, 176) ;
           box-shadow: 0px 0px 20px 5px rgb(176, 85, 16) ; /*glowing effect*/

            /* [inset], x-distance, y-distance, blur-radius, spread-radius, color */


        }

        h1{

            text-shadow: 0px 0px 5px red;
             /* x-distance, y-distance, blur-radius, color */
             font-size: 100px;
             color:transparent
        }
        .example{
            /* background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSEyV4ZKvIxMW3kFTirByA5ZTGostPpPKbgQ&s"); */
            background-image: linear-gradient( red, orange,  violet, blue, green, yellow);
            background-clip: text;
            height: auto;
        }
            
    </style>
</head>
<body>

    <div class="example">
        <h1>HELLO WORLD</h1>
    </div>

    <div class="demo1"></div>

    <div class="demo2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste in dignissimos eius cupiditate a mollitia, illum maxime repellendus iusto neque sapiente, iure reiciendis nostrum quam suscipit veritatis sequi consectetur quas!</div>
    <div class="demo3"></div>
    
    
    
</body>
</html>
