<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <form>
        <fieldset>
            <table>
                <tr>
            <legend>General Information</legend>
        <label for="fname">First Name</label>
        <input type=" text" id="fname" name="fname" placeholder="Enter your first name here" autocomplete="off"
            maxlength="8" required></tr>
        <br><br>
                    <!-- aba table banauna chai make row to everysections and make one td for label and another td for input -->
        <tr>
        <label for="lname">Last Name</label>
        <input type=" text" id="lname" name="lname"> </tr>
        <br><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter ur age" value="1" required max="99" min="1">
        </table>
        </fieldset>
        <br><br>
        

        <fieldset > 
        <!-- disabled can be used in fieldset to control multiple sections of the forms at the same time -->
        <legend>Login Information</legend>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email here">
        <br><br>

        <label for="pass">Password</label>
        <input type="password" name="" id=""> </fieldset><br><br>

        <label for="dob">Date of Birht</label>
        <input type="date" id="dob" name="dob" value="2008-01-01" max="2026-05-21" min="2006-01-01">

        <input type="datetime-local" name="" id="">
        <input type="time" name="" id="">
        <br><br>

        <label for="sal">Expected Salary</label>
        <input type="range" id="sal" name="salary" min="100" max="1000" step="100" value="100">
        <br><br>

        <label>Hobbies</label><br>
        
        <input type="checkbox" id="read" name="hobby" value="r" checked>
        <label for="read">Reading books</label>

        <input type="checkbox" id="travel" name="hobby" value="t">
        <label for="travel">Travelling</label>

        <input type="checkbox" id="music" name="hobby" value="m">
        <label for="music">Singing</label>
        <br><br>

        <LAbel>Gender</LAbel>
        <br>
        <input type="radio" id="male" value="m" name="gender">
        <label for="male">Male</label>

        <!-- same name diyena vane sabai tick garna milxa rey so same name for only one selection -->

        <input type="radio" id="female" value="f" name="gender">
        <label for="female">Female</label>

        <input type="radio" id="Others" value="o" name="gender">
        <label for="Others">Others</label>
        <br><br>
        <input type="color" name="color" id=""><br><br>

        <input type="search" name="" id="" placeholder="same like input but with x sign"><br><br>


        <label for="desc">About Yourself</label>
        <textarea name="desc" id="" rows="5" placeholder="About Yourself"></textarea><br><br>
        

        <label for="add">Address</label>
        <select name="address" id="add">
            <option value="ktm">Kathmandu</option>
            <option value="jp" selected>Jhapa</option>
            <option value="ltl">Lalitpur</option>
            <option value="ktg">Khotang</option>
            <option value="th">Tanahun</option>
        </select><br><br>

        
        <input type="url" name="" id="" placeholder="enter a url"><br><br>
        <input type="file" accept=".jpg .pdf"><br><br>

        <input type="reset" name="" id="" value="Clear"  ><br><br> <!-- value is used to give name to the rename button -->
        <input type="submit" name="" id="" value="Register">




        <br><br>
        <button>Submit</button>

    </form>
</body>

</html>
