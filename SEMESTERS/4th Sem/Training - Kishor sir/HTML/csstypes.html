<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="mystyle.css">
    <style>
        h1
        {
            color: red;
            font-size: 45px;
            text-align: center;
            text-decoration: underline;
        }
        </style>
</head>
<body>
    <!-- type of css
    internal css : written in same html page in style tag   
    external css : wwritten in separate html file and linked to html page using link tag
    inline css : written in html tag using style attribute

    if all css types are used in same html page then inline css
    will override internal css and internal css will override
    external css

    internal css will override external css because internal css 
    is written in same html page and external css is written in 
    separate html file
    
    note: internal and external has the same priority but if 
    both are used in same html page then internal css will 
    override external css because internal css is written in 
    same html page and external css is written in separate 
    html file
    -->

<!-- BOX MODEL : content + padding + border + margin
margin : space outside the border
border : space between padding and margin
padding : space between content and border
content : actual content of the element 
-->

<!-- margin
border
padding
content -->


    <h1 style="text-decoration: underline;">HELLO WORLD</h1>
    <h2>Hi there</h2>
</body>
</html>
