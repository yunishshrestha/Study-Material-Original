<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        .hmenu{
            display: none;
        }
        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #333;
            color: #fff;

        }
        .logo{
            font-size: 24px;
            font-weight: bold;
        }
        .menu{
            list-style: none;
            display: flex;

        }
    
        .menu li{
            margin: 0 15px;
            
        }
        @media (max-width: 768px) {
            .menu{
                display: none;
            }
            .hmenu{
                display: block;
                background-color: #333;
                color: #fff;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
            }
        }

    </style>
</head>
<body>
    <header>
        <div class="logo">LOGO</div>
        <ul class="menu">
            <li>HOME</li>
            <li>ABOUT</li>
            <li>SERVICES</li>
            <li>BLOG</li>
            <li>CONTACT</li>
        </ul>
        <button class="hmenu">
            <ul class="menu">
            <li>HOME</li>
            <li>ABOUT</li>
            <li>SERVICES</li>
            <li>BLOG</li>
            <li>CONTACT</li>
        </ul>
        </button>
    </header>
</body>
</html>
