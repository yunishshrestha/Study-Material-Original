<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./game.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <h2>Choose your option</h2>
    <div class="player_inputs">
        <img src="./ROCK.png" alt="rock" onclick="player_choice(0)">
        <img src="./PAPER.png" alt="paper" onclick="player_choice(1)">
        <img src="./SCISSORS.png" alt="scissors" onclick="player_choice(2)">
    </div>
    <div class="container">
        <div class="player">
            <h1>Player</h1>
            <img src="./ROCK.png" alt="" id="player">
        </div>

        <div class="computer">
            <h1>Computer</h1>
            <img src="./ROCK.png" alt="" id="computer">
        </div>
     </div>
        <h1 id="result">Result</h1>
        <script src="./game.js"></script>

</body>
</html>
