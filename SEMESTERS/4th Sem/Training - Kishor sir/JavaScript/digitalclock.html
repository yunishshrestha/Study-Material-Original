<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 id="clock">Digital Clock</h1>
    <script>
        function showTime(){
            let today= new Date()
            let timeNow = today.toLocaleTimeString()
            document.getElementById('clock').innerHTML = timeNow
        }
        // Call the function immediately to display the time
        showTime()
        // Update the time every second
        setInterval(showTime, 1000)
    </script>
</body>
</html>
