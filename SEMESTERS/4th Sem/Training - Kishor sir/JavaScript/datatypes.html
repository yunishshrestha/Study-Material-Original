<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Data Types in JavaScript
    1.Number 
    2.String
    3.Boolean
    4.Undefined
    5.objects - js object, array, function, date, regex, error, map, set, weakmap, weakset, null, symbol, bigint, etc.
    -->
    <script>
        let a = 5.5
        document.write(a," is a ", typeof(a), '<br>')
        let b = 5
        document.write(b," is a ", typeof(b), '<br>')
        let c = 5e3
        document.write(c," is a ", typeof(c), '<br>')

        //strings
        let str1 = "Hello World"
        document.write(str1," is a ", typeof(str1), '<br>')
        let str2 = 'Hello World'
        document.write(str2," is a ", typeof(str2), '<br>')

        //boolean
        let bool1 = true
        document.write(bool1," is a ", typeof(bool1), '<br>')
        let bool2 = false
        document.write(bool2," is a ", typeof(bool2), '<br>')

        //undefined
        let t
        document.write(t," is a ", typeof(t), '<br>')

        //objects
        let f=null
        document.write(f," is a ", typeof(f), '<br>')
        let obj = {name: "Yunus", age: 21}
        document.write(obj," is a ", typeof(obj), '<br>')
        let arr = [1, 2, 3, 4, 5]
        document.write(arr," is a ", typeof(arr), '<br>')
    


    </script>
</body>
</html>
